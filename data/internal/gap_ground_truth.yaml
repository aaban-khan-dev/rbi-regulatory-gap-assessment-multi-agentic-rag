# Planted coverage patterns for the synthetic internal policy corpus.
# The company and its policies are fictional; the regulatory clauses are real.
#
# Required fields per obligation
#   doc_id       RBI document the obligation comes from
#   clause_path  the clause_path of the chunk in data/processed/<doc_id>.jsonl
#                that holds the obligation. Every (doc_id, clause_path) pair
#                here matches exactly one chunk.
#   outcome      COVERED | PARTIAL | GAP | STALE
#   policy_doc   the policy file (data/internal/<policy_doc>.md) that carries
#                the control. For GAP: the document a reader would expect to
#                cover it, which is silent on it.
#   note         one line on what is missing or stale (non-COVERED only)
#
# Lookup fields
#   sub_clause    the precise paragraph inside that chunk, when the obligation
#                 is a sub-clause rather than the chunk's first clause. The
#                 chunker files a chunk under its first clause, so sub-clauses
#                 only appear in the chunk's `covers` list.
#   chunk_id      the chunk itself
#   stale_source  STALE only: the superseded or inapplicable source the policy
#                 is anchored to, addressed the same way

meta:
  company: Kestrel Wallet Services Private Limited (brand KestrelPay), fictional
  entity_type: non-bank PPI issuer
  assessment_as_of: "2026-10-01"
