# Retrieval gold set. LLM-drafted and human-reviewed: Claude read each gold chunk
# and drafted the query and labels; Mohammad reviews and approves each revision.
# Scoring rules: docs/EVALUATION.md.
#
# Item fields
#   item_id            G-NNN
#   source             OBL-xx (a row of data/internal/gap_ground_truth.yaml),
#                      amendment_chain, dpsc, kyc_repeal, or kyc_version_pair
#   corpus             regulation | internal: the corpus the query is run against
#   category           straightforward | paraphrased | version_sensitive | repealed_document
#   query              natural-language question, written without the clause's wording
#   gold_chunk_ids     every chunk whose text answers the query (at least one)
#   gold_clause_paths  the clause_path of each gold chunk, in the same order, exactly
#                      as the chunker stored it (null where the chunker stored null)
#   as_of              regulation items only: the date the question is asked
#                      about. Every gold chunk is in force on it. Items from an
#                      OBL row use that row's date in gap_ground_truth.yaml.
#                      Internal items have none: the policy corpus is not versioned.
#
# Optional fields
#   stale_chunk_ids    chunks on the same topic from a document version that is
#                      not in force on as_of, which a version-unaware retriever
#                      is likely to return instead. Input for the stale-version
#                      retrieval rate.
#   note               where the chunker's label differs from the real paragraph
#
# Categories
#   straightforward    names the topic in the usual compliance term (escrow, PEP,
#                      CKYCR) but not the clause's sentence
#   paraphrased        describes the situation in everyday words, avoiding the
#                      clause's key terms
#   version_sensitive  the answer is text inserted or changed by an amendment
#                      circular, the question asks what an amendment changed, or
#                      the same question is asked at two dates and must return
#                      md-kyc-2016-v2018 (as_of 2019-01-01) or md-kyc-2016
#                      (as_of 2025-10-01)
#   repealed_document  the answer depends on a repeal. Current questions
#                      (as_of 2026-10-01) must return an in-force PPI clause, with
#                      the repealed md-dpsc-2021 or md-kyc-2016 clause as the
#                      stale distractor. Historical questions (as_of 2024-06-01)
#                      must return the DPSC clause.
#
# Dates used for as_of
#   2019-01-01  inside md-kyc-2016-v2018's window (2018-07-12 to 2019-05-29)
#   2024-06-01  md-dpsc-2021 in force
#   2025-10-01  md-kyc-2016 as amended to 2025-08-14 is the operative text: after
#               the last amendment, before the 2025-11-28 repeal
#   2026-10-01  assessment date; md-kyc-2016 and md-dpsc-2021 both repealed
#
# Gold rule: a chunk is gold if its text answers the query. Amendment circulars
# repeat inserted text verbatim, so questions on amended KYC text list both the
# consolidated Master Direction chunk and the amendment chunk.
#
# Uniqueness: (query, as_of) is unique. The version pairs repeat a query word
# for word at two dates on purpose, so only the date can tell them apart.

